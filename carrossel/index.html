<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Carrossel Zanellato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600;700&family=Kalam:wght@700&family=IBM+Plex+Mono:wght@400;500&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;0,8..60,900;1,8..60,600&display=swap">
<style>
/* ============================================================
   UI DO EDITOR
   ============================================================ */
:root{
  --ui-bg:#0d0f0e; --ui-panel:#141816; --ui-line:#232a26; --ui-ink:#eef2ef;
  --ui-muted:#8b958f; --ui-green:#e8e8e8; --ui-warn:#ffb648; --ui-err:#ff5d5d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ui-bg);color:var(--ui-ink);font:14px/1.45 Poppins,system-ui,sans-serif;display:flex;overflow:hidden}
aside{width:440px;min-width:440px;height:100vh;overflow-y:auto;background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:20px 20px 80px}
main{flex:1;height:100vh;overflow:auto;padding:28px}
aside h1{font:700 20px Poppins,sans-serif;margin:0 0 2px;letter-spacing:-.02em}
aside h1 b{color:var(--ui-green)}
.sub{color:var(--ui-muted);font-size:12px;margin-bottom:18px}
aside h2{font:600 11px Poppins,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ui-muted);margin:22px 0 10px}
label{display:block;font-size:11px;color:var(--ui-muted);margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;background:#0b0d0c;border:1px solid var(--ui-line);color:var(--ui-ink);border-radius:8px;padding:8px 10px;font:13px Poppins,sans-serif}
textarea{resize:vertical;min-height:58px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ui-green)}
.row{display:flex;gap:8px}.row>*{flex:1}
button,.btn{background:#1d2420;color:var(--ui-ink);border:1px solid var(--ui-line);border-radius:8px;padding:8px 12px;font:500 12px Poppins,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--ui-green)}
button.primary{background:var(--ui-green);color:#111;border-color:var(--ui-green);font-weight:700}
button.small{padding:4px 8px;font-size:11px}
.card{border:1px solid var(--ui-line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#111412}
.card.sel{border-color:var(--ui-green)}
.card-h{display:flex;align-items:center;gap:8px}
.card-h strong{font:600 13px Poppins,sans-serif;flex:1}
.pill{font:600 10px Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#1f2a24;color:var(--ui-green)}
.img-field{display:flex;gap:6px}.img-field input[type=text]{flex:1}
.img-field input[type=file]{display:none}
.hint{font-size:11px;color:var(--ui-muted);margin-top:4px}
.checks{font-size:12px;border-radius:10px;padding:10px 12px;background:#0b0d0c;border:1px solid var(--ui-line)}
.checks div{margin:2px 0}.ok{color:var(--ui-green)}.warn{color:var(--ui-warn)}.err{color:var(--ui-err)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.toolbar .zoom{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--ui-muted);font-size:12px}
#stage{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.frame{position:relative;flex:none;border-radius:6px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);cursor:pointer}
.frame .num{position:absolute;left:8px;top:8px;z-index:50;font:700 11px Poppins;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:99px}
.frame .slide{transform-origin:0 0}
details summary{cursor:pointer;color:var(--ui-muted);font-size:12px;margin:8px 0}
#status{font-size:12px;color:var(--ui-muted)}
/* modo render (exportação headless): só os slides, escala 1 */
body.render{display:block;overflow:visible;background:#000}
body.render aside, body.render .toolbar{display:none}
body.render main{height:auto;padding:0}
body.render #stage{gap:0;display:block}
body.render .frame{border-radius:0;box-shadow:none;margin:0}
body.render .frame .num{display:none}

/* ============================================================
   SLIDE — 1080 x 1350 (4:5)
   ============================================================ */
.slide{
  --bg:#FFFFFF; --ink:#111111; --body:#222222; --muted:#7A7A7A; --grid:rgba(0,0,0,.045);
  --glow:rgba(255,255,255,0); --ac:#14291F;
  position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Poppins,sans-serif;-webkit-font-smoothing:antialiased;
}
.slide.t-escuro{--bg:#14291F;--ink:#FFFFFF;--body:#E3ECE8;--muted:#8FA59C;--grid:rgba(255,255,255,.045);--glow:rgba(0,0,0,0);--ac:#D9CFB8}
.slide b,.slide strong{font-weight:700;color:var(--ink)}
.slide em{font-style:normal;color:var(--ac)}
.cta em{font-weight:700}
.slide i.sf{font-family:"Source Serif 4",serif;font-style:italic;font-weight:600;letter-spacing:-.01em}
/* papel: grade + brilho */
.paper::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px;background-position:0 -1px}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 700px at 0% 0%,var(--glow),transparent 70%)}
.paper>*{position:relative;z-index:2}
.t-escuro.paper::before{background-image:url(grain.png);background-size:220px 220px;opacity:.9}
.t-escuro.paper::after{background:none}
/* cabeçalho */
.hd{position:absolute;left:92px;right:92px;top:58px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.mark{font:900 68px/1 "Source Serif 4",serif;letter-spacing:-.04em;color:var(--ink);display:flex;align-items:center}
.mark span{color:var(--ac)}
.mark img{height:58px;width:auto;display:block}
.brand{font:400 22px "IBM Plex Mono",monospace;letter-spacing:.32em;color:var(--ink);text-transform:uppercase}
/* rodapé */
.ft{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;z-index:5}
.ft .lb{font:600 23px Poppins,sans-serif;color:var(--ink);letter-spacing:-.005em}
/* corpo do slide de conteúdo */
.body{position:absolute;left:128px;right:128px;top:190px;bottom:190px;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.kick{font:600 21px Poppins,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:var(--ac);margin-bottom:34px}
.ttl{font:700 74px/1.04 Poppins,sans-serif;letter-spacing:-.035em;margin:0;color:var(--ink);max-width:820px}
.ttl .n{letter-spacing:-.04em}
.st{font:700 25px/1.32 Poppins,sans-serif;letter-spacing:-.01em;margin:16px 0 0;max-width:600px;color:var(--ink)}
.txt{margin-top:46px;font:400 35px/1.3 Poppins,sans-serif;letter-spacing:-.012em;color:var(--body)}
.txt p{margin:0 0 26px}.txt p:last-child{margin-bottom:0}
.lst{list-style:none;margin:0 0 26px;padding:0;font-size:35px;line-height:1.5}
.lst li b{font-weight:700}
.lst .dot{color:var(--ac);margin:0 14px;font-weight:700}
.lst .ds{color:var(--muted)}
.lst .no{font-weight:700;color:var(--ink);margin-right:18px}
.pics{display:flex;gap:20px;margin-top:44px}
.body.flow{top:150px;bottom:150px;left:128px;right:128px;justify-content:flex-start;padding-bottom:0}
.flow .ttl{font-size:64px}
.flow .st{font:500 36px/1.4 Poppins,sans-serif;letter-spacing:-.005em;color:var(--body);max-width:780px;margin-top:26px;text-wrap:pretty}
.flow .txt{font-size:34px;margin-top:36px}
.draw{position:relative;width:100%;flex:1 1 auto;min-height:220px;max-height:430px;margin:auto 0}
.spacer{flex:1 1 auto}
.man .m1{font:700 100px/1.06 Poppins,sans-serif;letter-spacing:-.05em;color:var(--ink);margin-top:40px}
.man .m2{font:400 70px/1.14 Poppins,sans-serif;letter-spacing:-.035em;color:var(--muted);margin-top:30px}
.man .m2 b,.man .m1 b{color:var(--ink)}
.slide.t-preto{--bg:#0D0D0D;--ink:#FFFFFF;--body:#E6E6E6;--muted:#9A9A9A;--grid:rgba(255,255,255,.035);--glow:rgba(0,0,0,0);--ac:#3FD18A}
.slide{--hl:#12965A}.slide.t-escuro,.slide.t-preto{--hl:#3FD18A}
.t-preto .man .mil img{mix-blend-mode:screen;filter:invert(1)}
.vers .aspas{font:400 300px/.55 "Instrument Serif",serif;color:var(--muted);opacity:.55;margin-bottom:6px}
.vers .vt{font:italic 400 80px/1.1 "Instrument Serif",serif;letter-spacing:-.01em;color:var(--ink)}
.vers .vref{font:600 20px Poppins,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-top:46px}
.par .pw{font:400 190px/.86 Anton,sans-serif;letter-spacing:.005em;text-transform:uppercase;color:var(--ink)}
.par .pt{font:400 54px/1.18 Poppins,sans-serif;text-wrap:balance;max-width:700px;letter-spacing:-.02em;color:var(--muted);margin-top:18px}
.par .psep{height:110px;position:relative}
.ctam .plane{width:118px;height:118px;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;margin-bottom:46px}
.ctam .m1{margin-top:0}
.ctam .chandle{align-self:flex-start;margin-top:56px;font:600 22px Poppins,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);border:2px solid var(--muted);border-radius:99px;padding:16px 30px}
.ctam .chandle em{color:var(--ink)}
.man .m3{font:600 30px Poppins,sans-serif;color:var(--muted);margin-top:40px}
.man.cit .m1{font:500 66px/1.22 Poppins,sans-serif;letter-spacing:-.03em}
.man.cit .m2{font:500 30px Poppins,sans-serif;letter-spacing:.02em;margin-top:34px}
.cil{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:34px 0 0;max-height:520px}
.cil img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.t-escuro .cil img{mix-blend-mode:screen;filter:invert(1)}
.cil img[src^="data:image/svg"]{mix-blend-mode:normal;filter:none}
.t-escuro .cil img:not([src^="data:image/svg"]),.t-preto .cil img:not([src^="data:image/svg"]){mix-blend-mode:normal;filter:none;background:#fff;border-radius:26px;padding:22px;box-sizing:border-box}
.cil.nocard img{background:none !important;padding:0 !important;border-radius:0 !important;mix-blend-mode:normal !important;filter:drop-shadow(0 18px 30px rgba(0,0,0,.25)) !important}
.slide{--icc:#CFCFCF;--icp:#1B1B1B;--icv:#12965A}.slide.t-escuro,.slide.t-preto{--icc:rgba(255,255,255,.32);--icp:#FFFFFF;--icv:#3FD18A}
.icset{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:40px;margin-top:30px}
.icg{display:flex;flex-direction:column;align-items:center}
.icrow{display:flex;align-items:flex-end;justify-content:center;gap:40px}
.ici{display:flex;flex-direction:column;align-items:center}
.ic-preco{font:700 32px Poppins,sans-serif;letter-spacing:-.02em;color:var(--ink);margin-bottom:12px}
.ici:not(.dest) .ic-preco{color:var(--muted)}
.ic-rot{font:600 26px Poppins,sans-serif;color:var(--muted);margin-top:14px;white-space:nowrap}
.ici.dest .ic-rot{color:var(--ink)}
.ic-nota{font:600 32px/1 Caveat,cursive;color:var(--muted);margin-top:8px;white-space:nowrap}
.ici.dest .ic-nota{color:var(--ink)}
.ic-carta{border-radius:16px}
.icsep{width:3px;align-self:stretch;margin:20px 0;background:var(--icc);border-radius:2px}
.icg-t{font:600 26px Poppins,sans-serif;color:var(--ink);margin-top:22px;text-align:center}
.man .icset{flex:1 1 auto;margin-top:50px}
.man .mil{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;justify-content:flex-end;margin-top:40px}
.man .mil img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.t-escuro .man .mil img{mix-blend-mode:screen;filter:invert(1)}
.man .mdraw{flex:none;align-self:flex-end;width:720px;height:520px;margin:0;max-height:none;min-height:0}
.flow.nodraw .txt{font-size:34px}
.flow.nodraw .lst{font-size:42px;line-height:1.85;margin-top:28px}
.ex{position:relative;align-self:stretch;margin-top:30px;padding:24px 30px 26px;border-radius:20px;background:var(--exbg);font:400 30px/1.38 Poppins,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.slide{--exbg:#EEF4F0}.slide.t-escuro,.slide.t-preto{--exbg:rgba(255,255,255,.09)}
.ex .exl{display:block;font:600 16px/1 Poppins,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ac);margin-bottom:12px}
.ovl{position:absolute;left:0;top:0;width:1080px;height:1350px;z-index:6;pointer-events:none;overflow:visible}
.ovl text{font-family:Caveat,cursive;font-weight:600}
.gancho{position:relative;z-index:5;margin-top:40px;align-self:flex-start;padding-right:96px;font:700 38px/1.2 Kalam,cursive;color:var(--ink);max-width:100%}
.hc,.hu{position:relative;white-space:nowrap}
.hc{margin:0 .35em}
.pics.first{margin-top:0;margin-bottom:48px}
.pic{flex:1;min-width:0;border-radius:22px;overflow:hidden;background:#e6e6e6}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.cap{margin-top:14px;font:500 19px Poppins,sans-serif;letter-spacing:.02em;color:var(--muted)}
.pics.first+.cap{margin:-34px 0 48px}
/* CTA / resumo */
.ctt{font:700 86px/1.14 Poppins,sans-serif;letter-spacing:-.04em;margin:0;color:var(--ink)}
.ctt em{font-style:italic}
.ctpre{font:600 58px/1.15 Poppins,sans-serif;letter-spacing:-.03em;color:var(--ink);opacity:.62;margin-bottom:24px}
.ctx{margin-top:44px;font:500 35px/1.4 Poppins,sans-serif;color:var(--body);max-width:720px}
.cta{margin-top:60px;font:700 40px/1.3 Poppins,sans-serif;letter-spacing:-.015em;color:var(--ink);background:var(--exbg);border-radius:22px;padding:34px 40px}
.cta em{color:var(--ac)}
.avatar{width:132px;height:132px;border-radius:50%;overflow:hidden;margin-bottom:40px;border:4px solid var(--bg);box-shadow:0 0 0 2px var(--ac)}
.avatar img{width:100%;height:100%;object-fit:cover}
/* foto cheia (capa e slide de foto) */
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cut{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:4;pointer-events:none}
.ph{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,#2a2f2c 0 26px,#252a27 26px 52px);color:#7d877f;font:600 30px Poppins;letter-spacing:.1em;text-transform:uppercase}
.shade{position:absolute;inset:0;z-index:1}
/* capa */
.cover-t{position:absolute;left:0;right:0;z-index:3;display:flex;justify-content:center}
.cover-t .blk{display:inline-flex;flex-direction:column;color:var(--cv)}
.cover-t .r1{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px}
.cover-t .pre{font:500 30px/.95 Archivo,sans-serif;letter-spacing:-.045em;text-align:right;padding-bottom:.32em;white-space:pre-line}
.cover-t .l1,.cover-t .l2{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.065em;line-height:.8;white-space:nowrap}
.cover-t .l2{margin-top:.02em}
.cover-t .pos{font:500 36px/1 Archivo,sans-serif;letter-spacing:-.04em;text-align:right;margin-top:10px;padding-right:.1em}
.cover-t em{color:var(--ac);font-style:normal}
.cover-sw{position:absolute;right:70px;bottom:62px;z-index:5;font:600 22px Poppins;color:var(--cv);opacity:.9}
/* slide de foto */
.ph-txt{position:absolute;left:92px;right:92px;bottom:190px;z-index:3;color:#fff}
.ph-txt .kick{color:var(--ac)}
.ph-txt .ttl,.ph-txt b{color:#fff}
.ph-txt .txt{color:rgba(255,255,255,.86);margin-top:26px}
.on-photo .ft .lb{color:#fff}
.on-photo .mark,.on-photo .brand{color:#fff}
</style>
</head>
<body>
<aside>
  <h1>Carrossel <b>Zanellato</b></h1>
  <div class="sub">Capa com foto · slides de texto e imagens (1 ou 2) · CTA sempre no final.</div>

  <h2>Marca</h2>
  <div class="row">
    <div><label>Marca (topo direito)</label><input type="text" data-m="brand"></div>
    <div><label>@ do Instagram</label><input type="text" data-m="handle"></div>
  </div>
  <div class="row">
    <div><label>Tema</label><select data-m="tema"><option value="claro">Claro (papel)</option><option value="escuro">Escuro</option></select></div>
    <div><label>Cor de destaque</label><input type="text" data-m="cor" placeholder="auto"></div>
  </div>
  <label>Símbolo (topo esquerdo)</label><input type="text" data-m="mark" placeholder="vazio = sem símbolo">
  <label>Logo (opcional — substitui o símbolo)</label>
  <div class="img-field"><input type="text" data-m="logo" placeholder="vazio = usa o símbolo"><input type="file" accept="image/*" data-mfile="logo"><button class="small" data-pick>Enviar</button></div>

  <h2>Checagem</h2>
  <div class="checks" id="checks"></div>

  <h2>Slides</h2>
  <div id="cards"></div>
  <div class="row" style="margin-top:6px">
    <select id="newType">
      <option value="conteudo">Conteúdo (texto + 1 ou 2 imagens)</option>
      <option value="foto">Foto cheia + texto</option>
      <option value="capa">Capa</option>
      <option value="cta">CTA / Resumo</option>
    </select>
    <button id="add" style="flex:none">+ Adicionar</button>
  </div>

  <h2>Dados (JSON)</h2>
  <details><summary>Importar / exportar roteiro</summary>
    <textarea id="json" style="min-height:220px;font:12px ui-monospace,monospace"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="jsonLoad">Aplicar JSON</button>
      <button id="jsonCopy">Atualizar do editor</button>
      <label class="btn" style="margin:0;justify-content:center">Abrir arquivo<input type="file" id="jsonFile" accept=".json" hidden></label>
    </div>
  </details>
</aside>

<main>
  <div class="toolbar">
    <button class="primary" id="exportZip">⬇ Baixar PNGs (.zip)</button>
    <button id="exportJson">Salvar roteiro .json</button>
    <button id="reset">Carregar exemplo</button>
    <span id="status"></span>
    <div class="zoom">Zoom <input type="range" id="zoom" min="0.2" max="0.7" step="0.02" value="0.34"></div>
  </div>
  <div id="stage"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ============================================================
   ESTADO + EXEMPLO
   ============================================================ */
const EXEMPLO = {
  marca:{mark:"", brand:"", handle:"@caiozanellato", tema:"claro", cor:"", logo:""},
  slides:[
    {tipo:"capa", foto:"", recorte:"", foco:"50% 30%", pre:"Como eu\nconstruiria uma", linha1:"Marca", linha2:"Pessoal", pos:"do zero", posicao:"topo", escurecer:10, cor_texto:"claro"},
    {tipo:"conteudo", numero:"01", titulo:"Defina sua mensagem", subtitulo:"Antes de postar, saiba o que quer que lembrem de você.", texto:"Marca pessoal não começa no conteúdo.\n\nComeça na clareza de **quem você ajuda** e **como você ajuda**."},
    {tipo:"conteudo", numero:"02", titulo:"Monte um sistema simples", subtitulo:"Você não precisa de estratégia complexa. Precisa de um motor que se repete.", texto:"Seu sistema precisa responder três perguntas:", itens:"1. Sobre o que você fala? (3 a 5 temas centrais)\n2. Como você expressa? (vídeo falando, cenas do dia, texto na tela)\n3. Com que frequência aparece? (um ritmo que você não vai quebrar)", texto_final:"Quando você segue um sistema, crescer vira conta, não motivação."},

/* ============================================================
   FORMATAÇÃO DE TEXTO
   **negrito**  *destaque na cor*  _serifa itálica_
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const capColon = s => String(s ?? "").replace(/:(\s+)(\p{Ll})/gu, (m,sp,c)=>":"+sp+c.toUpperCase());
function fmt(s){
  return esc(capColon(s))
    .replace(/\[\[(.+?)\]\]/g,'<span class="hc">$1</span>')
    .replace(/\{\{(.+?)\}\}/g,'<span class="hu">$1</span>')
    .replace(/\{handle\}/g, "<em>"+esc(state.marca.handle||"")+"</em>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/(^|[\s(])_(.+?)_(?=[\s.,!?;:)]|$)/g,'$1<i class="sf">$2</i>')
    .replace(/\n/g,"<br>");
}
const paras = s => String(s||"").trim().split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${fmt(p)}</p>`).join("");

function header(){
  const m = state.marca;

  if (!m.logo && !m.mark && !m.brand) return "";

}

  return `<div class="icset">${spec.grupos.map(g=>`<div class="icg">

        :`<svg viewBox="0 0 256 256" style="width:${it.tam||170}px;height:${it.tam||170}px;fill:${cor(it.cor)}">${it.svg||""}</svg>`}
      ${it.rotulo?`<div class="ic-rot">${it.cor==="verde"?`<span class="hu">${fmt(it.rotulo)}</span>`:fmt(it.rotulo)}</div>`:""}
      ${it.nota?`<div class="ic-nota">${fmt(it.nota)}</div>`:""}
    </div>`).join("")}</div>
    ${g.titulo?`<div class="icg-t">${fmt(g.titulo)}</div>`:""}
  </div>`).join(`<div class="icsep"></div>`)}</div>`;
}

  if (s.tipo === "capa"){
    const dark = s.cor_texto === "escuro";

        ${s.desenho?`<div class="draw" data-kind="${esc(s.desenho)}" data-labels="${esc(s.rotulos||"")}" style="height:${Number(s.altura_desenho)||300}px"></div>`:""}

  }
  if (s.tipo === "manifesto" && s.estilo === "versiculo"){
    return `<div class="slide paper ${tema}" style="${acc}"><div class="body flow man vers">
      <div class="spacer"></div><div class="aspas">“</div><div class="vt">${fmt(s.linha1)}</div><div class="vref">${fmt(s.linha2)}</div><div class="spacer"></div>

    const [t,...d] = l.split("|"); const ds = d.join("|").trim();

/* ============================================================
   DESENHOS À MÃO (rough.js)
   ============================================================ */
function offs(el, root){ let x=0,y=0,e=el; while(e && e!==root){ x+=e.offsetLeft; y+=e.offsetTop; e=e.offsetParent } return {x,y,w:el.offsetWidth,h:el.offsetHeight} }
function hashSeed(str){ let h=7; for(const c of str) h=(h*31+c.charCodeAt(0))%100000; return h||1 }
function drawAll(root){
  if (!window.rough) return;
  root.querySelectorAll(".slide").forEach((sl,idx)=>{
    sl.querySelectorAll(".ovl").forEach(o=>o.remove());
    const NS="http://www.w3.org/2000/svg";
    const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","ovl"); svg.setAttribute("viewBox","0 0 1080 1350"); sl.appendChild(svg);
    const cs=getComputedStyle(sl); const ink=cs.getPropertyValue("--ink").trim()||"#111", ac=cs.getPropertyValue("--ac").trim()||ink, muted=cs.getPropertyValue("--muted").trim()||"#777"; const bg=cs.getPropertyValue("--bg").trim()||"#fff";
    const rc=rough.svg(svg); let seed=hashSeed(sl.textContent.slice(0,60)+idx);
    const O=(o={})=>Object.assign({stroke:ink,strokeWidth:2.6,roughness:1.4,bowing:1.2,seed:(seed=seed+11)},o);
    const add=n=>svg.appendChild(n);
    const txt=(x,y,t,size=40,anchor="start",fill=ink,rot=0)=>{const e=document.createElementNS(NS,"text");e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("font-size",size);e.setAttribute("text-anchor",anchor);e.setAttribute("fill",fill);if(rot)e.setAttribute("transform",`rotate(${rot} ${x} ${y})`);e.textContent=t;add(e)};
    const arrow=(x1,y1,x2,y2,o={})=>{const mx=(x1+x2)/2+(o.bend||0), my=(y1+y2)/2-(o.lift??30);
      add(rc.curve([[x1,y1],[mx,my],[x2,y2]],O({strokeWidth:2.4,...o})));
      const a=Math.atan2(y2-my,x2-mx), L=20;
      add(rc.line(x2,y2,x2-L*Math.cos(a-0.5),y2-L*Math.sin(a-0.5),O({strokeWidth:2.4,...o})));
      add(rc.line(x2,y2,x2-L*Math.cos(a+0.5),y2-L*Math.sin(a+0.5),O({strokeWidth:2.4,...o})))};
    // marcações no texto
    const hl=cs.getPropertyValue("--hl").trim()||ac, mk=sl.querySelector(".man")?hl:ac;
    sl.querySelectorAll(".hc").forEach(e=>{const b=offs(e,sl); add(rc.ellipse(b.x+b.w/2,b.y+b.h/2+3,b.w+34,b.h+14,O({stroke:mk,strokeWidth:3,roughness:.9,bowing:.4})))});
    sl.querySelectorAll(".hu").forEach(e=>{const b=offs(e,sl); const y=b.y+b.h-2;
      add(rc.curve([[b.x-4,y],[b.x+b.w*.5,y+7],[b.x+b.w+6,y-3]],O({stroke:mk,strokeWidth:3.4,roughness:1.8})));
      add(rc.curve([[b.x+8,y+7],[b.x+b.w*.55,y+10],[b.x+b.w-4,y+6]],O({stroke:mk,strokeWidth:2,roughness:1.6})))});
    // gancho: seta à mão depois do texto
    const head=(pts,o={})=>{const n=pts.length,[x1,y1]=pts[n-2],[x2,y2]=pts[n-1],a=Math.atan2(y2-y1,x2-x1),L=22;
      add(rc.curve(pts,O({strokeWidth:2.6,...o})));
      add(rc.line(x2,y2,x2-L*Math.cos(a-0.5),y2-L*Math.sin(a-0.5),O({strokeWidth:2.6,...o})));
      add(rc.line(x2,y2,x2-L*Math.cos(a+0.5),y2-L*Math.sin(a+0.5),O({strokeWidth:2.6,...o})))};
    sl.querySelectorAll(".ex").forEach(e=>{const b=offs(e,sl);
      });
    sl.querySelectorAll(".psep").forEach(e=>{const b=offs(e,sl); const y=b.y+b.h/2;
      add(rc.curve([[b.x,y+4],[b.x+160,y-6],[b.x+320,y+2]],O({stroke:hl,strokeWidth:4.2,roughness:1.3})))});
    const g=sl.querySelector(".gancho");
    if(g){const b=offs(g,sl); const r=b.x+b.w, my=b.y+b.h*.55, v=+(g.dataset.v||0)%3;
      const ao={strokeWidth:3.4};
      if(v===0) head([[r-80,my+2],[r-44,my-6],[r-6,my+2]],ao);
      else if(v===1) head([[r-82,my+8],[r-58,my-6],[r-32,my+6],[r-6,my-2]],ao);
      else head([[r-82,my-10],[r-44,my+8],[r-6,my]],ao);
    }
    // desenhos
    sl.querySelectorAll(".draw").forEach(d=>{
      const b=offs(d,sl), k=d.dataset.kind, L=(d.dataset.labels||"").split("|").map(x=>x.trim());
      const {x,y,w,h}=b;
      const fill=(o={})=>O({fill:ac,fillStyle:"hachure",hachureGap:10,fillWeight:1.4,stroke:ac,...o});
      const dot=(cx,cy,r=7,c=ac)=>add(rc.circle(cx,cy,r*2,O({fill:c,fillStyle:"solid",stroke:c,roughness:.8})));
      if(k==="alvo"){

/* ajusta o título da capa para ocupar ~68% da largura */
function fitCovers(root){
  root.querySelectorAll("[data-fit]").forEach(blk=>{
    const l1 = blk.querySelector(".l1"), l2 = blk.querySelector(".l2");
    l2.style.fontSize = "200px"; l1.style.fontSize = "100px";
    const w2 = l2.scrollWidth || 1;
    const size2 = Math.min(330, 200 * 740 / w2);
    l2.style.fontSize = size2+"px";
    // linha 1: ~50% do tamanho, sem passar da largura da linha 2
    let size1 = size2*0.56; l1.style.fontSize = size1+"px";
    const r1 = blk.querySelector(".r1");
    const maxW = l2.scrollWidth;
    if (r1.scrollWidth > maxW) { size1 *= maxW / r1.scrollWidth; l1.style.fontSize = size1+"px"; }
    const pre = blk.querySelector(".pre"); if (pre) pre.style.fontSize = Math.max(22, size2*0.135)+"px";
    const pos = blk.querySelector(".pos"); if (pos) pos.style.fontSize = Math.max(26, size2*0.15)+"px";
  });
}

/* ============================================================
   PREVIEW
   ============================================================ */
const stage = document.getElementById("stage");
const isRender = new URLSearchParams(location.search).has("render");
if (isRender) document.body.classList.add("render");
let zoom = isRender ? 1 : 0.34;

async function renderAll(){
  const n = state.slides.length;
  stage.innerHTML = state.slides.map((s,i)=>
    `<div class="frame" data-i="${i}" style="width:${1080*zoom}px;height:${1350*zoom}px"><span class="num">${String(i+1).padStart(2,"0")}</span>
      <div style="transform:scale(${zoom});transform-origin:0 0;width:1080px;height:1350px">${renderSlide(s,i,n)}</div></div>`).join("");
  try { await document.fonts.ready } catch(e){}
  fitCovers(stage);
  try { drawAll(stage) } catch(e){ console.error(e) }
  stage.querySelectorAll(".frame").forEach(f=>f.onclick=()=>{ sel=+f.dataset.i; renderCards(); document.querySelector(`.card[data-i="${sel}"]`)?.scrollIntoView({behavior:"smooth",block:"start"}) });
  renderChecks();
}

/* ============================================================

   ============================================================ */
function checks(){
  const out = [], S = state.slides;
  if (!S.length) return [["err","Nenhum slide."]];
  if (S[0].tipo!=="capa" && S[0].tipo!=="pronta") out.push(["err","O 1º slide precisa ser a CAPA."]);
  else if (!S[0].foto) out.push(["err","A capa precisa de uma FOTO."]);
  else out.push(["ok","Capa com foto ✓"]);
  if (S[S.length-1].tipo!=="cta" && !S[S.length-1].cta) out.push(["err","O último slide precisa ser o CTA."]);
  else out.push(["ok","CTA no final ✓"]);
  if (S.length<4) out.push(["warn",`Só ${S.length} slides — ideal entre 5 e 9.`]);
  else if (S.length>10) out.push(["warn",`${S.length} slides — o Instagram aceita até 20, mas acima de 10 a retenção cai.`]);
  else out.push(["ok",`${S.length} slides ✓`]);
  S.forEach((s,i)=>{
    const len = [s.texto,s.itens,s.texto_final].join(" ").length;
    if (s.tipo==="conteudo" && len>330) out.push(["warn",`Slide ${i+1}: texto longo (${len} caracteres). Corte para caber com folga.`]);
    if (s.tipo==="foto" && !s.foto) out.push(["warn",`Slide ${i+1}: slide de foto sem foto.`]);
  });
  return out;
}
function renderChecks(){
  document.getElementById("checks").innerHTML = checks().map(([c,t])=>`<div class="${c}">${c==="ok"?"●":c==="warn"?"▲":"✕"} ${t}</div>`).join("");
}

/* ============================================================
   EDITOR
   ============================================================ */
const cards = document.getElementById("cards");
let t;
const changed = () => { clearTimeout(t); t = setTimeout(()=>{ save(); renderAll() }, 180) };

function resizeImage(file, keepPng){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 2160, k = Math.min(1, max/Math.max(im.width,im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        res(keepPng || file.type==="image/png" ? c.toDataURL("image/png") : c.toDataURL("image/jpeg",0.9));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function field(s, i, [key,type,label,opts]){
  const v = s[key] ?? "";
  const shown = typeof v==="string" && v.startsWith("data:") ? "(imagem enviada)" : v;
  if (type==="img") return `<label>${label}</label><div class="img-field"><input type="text" data-k="${key}" value="${esc(shown)}" placeholder="URL ou envie"><input type="file" accept="image/*" data-file="${key}"><button class="small" data-pick>Enviar</button>${v?`<button class="small" data-clear="${key}">✕</button>`:""}</div>`;
  if (type==="area") return `<label>${label}</label><textarea data-k="${key}">${esc(v)}</textarea>`;
  if (type==="sel") return `<label>${label}</label><select data-k="${key}">${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  return `<label>${label}</label><input type="${type==="num"?"number":"text"}" data-k="${key}" value="${esc(v)}">`;
}

function renderCards(){
  cards.innerHTML = state.slides.map((s,i)=>{
    const T = TIPOS[s.tipo] || TIPOS.conteudo;
    const open = i===sel;
    return `<div class="card ${open?"sel":""}" data-i="${i}">
      <div class="card-h"><span class="pill">${String(i+1).padStart(2,"0")}</span><strong>${T.nome}${s.titulo||s.linha2?` — ${esc(String(s.titulo||s.linha2).replace(/[*_]/g,"").slice(0,26))}`:""}</strong>
        <button class="small" data-act="up">↑</button><button class="small" data-act="down">↓</button><button class="small" data-act="dup">⧉</button><button class="small" data-act="del">✕</button></div>
      ${open ? T.campos.map(c=>field(s,i,c)).join("") + `<div class="hint">Formatação: **negrito** · *destaque na cor* · _serifa itálica_</div>` : ""}
    </div>`;
  }).join("");
}

cards.addEventListener("click", e=>{
  const card = e.target.closest(".card"); if(!card) return;
  const i = +card.dataset.i;
  const act = e.target.dataset.act;
  if (e.target.dataset.pick !== undefined){ e.target.parentNode.querySelector("input[type=file]").click(); return }
  if (e.target.dataset.clear){ state.slides[i][e.target.dataset.clear]=""; renderCards(); changed(); return }
  if (act){
    const S = state.slides;
    if (act==="up" && i>0){ [S[i-1],S[i]]=[S[i],S[i-1]]; sel=i-1 }
    if (act==="down" && i<S.length-1){ [S[i+1],S[i]]=[S[i],S[i+1]]; sel=i+1 }
    if (act==="dup"){ S.splice(i+1,0,structuredClone(S[i])); sel=i+1 }
    if (act==="del" && confirm("Remover este slide?")){ S.splice(i,1); sel=Math.max(0,i-1) }
    renderCards(); changed(); return;
  }
  if (e.target.closest(".card-h") && sel!==i){ sel=i; renderCards() }
});
cards.addEventListener("input", e=>{
  const card = e.target.closest(".card"); const k = e.target.dataset.k; if(!card||!k) return;
  if (e.target.value==="(imagem enviada)") return;
  state.slides[+card.dataset.i][k] = e.target.type==="number" ? Number(e.target.value) : e.target.value;
  changed();
});
cards.addEventListener("change", async e=>{
  const card = e.target.closest(".card"); const k = e.target.dataset.file; if(!card||!k||!e.target.files[0]) return;
  setStatus("Processando imagem…");
  state.slides[+card.dataset.i][k] = await resizeImage(e.target.files[0], k==="recorte");
  setStatus(""); renderCards(); changed();
});

/* marca */
document.querySelectorAll("[data-m]").forEach(el=>{
  const k = el.dataset.m; const v = state.marca[k]||"";
  el.value = typeof v==="string"&&v.startsWith("data:") ? "(imagem enviada)" : v;
  el.addEventListener("input",()=>{ if(el.value!=="(imagem enviada)"){ state.marca[k]=el.value; changed() } });
});
document.querySelector("aside").addEventListener("click", e=>{
  if (e.target.dataset.pick!==undefined && e.target.closest(".img-field")?.querySelector("[data-mfile]")) e.target.parentNode.querySelector("input[type=file]").click();
});
document.querySelector("[data-mfile]").addEventListener("change", async e=>{
  if(!e.target.files[0]) return;
  state.marca.logo = await resizeImage(e.target.files[0], true);
  document.querySelector('[data-m="logo"]').value="(imagem enviada)"; changed();
});

document.getElementById("add").onclick = ()=>{
  const tipo = document.getElementById("newType").value;
  const base = {capa:{tipo,foto:"",foco:"50% 30%",pre:"",linha1:"Título",linha2:"Gigante",pos:"",posicao:"topo",escurecer:15,cor_texto:"claro"},
    conteudo:{tipo,numero:"",titulo:"Novo slide",subtitulo:"",texto:""},
    foto:{tipo,foto:"",kicker:"",titulo:"",texto:""},
    cta:{tipo,kicker:"O resumo",titulo:"Frase final.",texto:"",chamada:"Salva esse post e segue {handle}"}}[tipo];
  // novo conteúdo entra antes do CTA final
  const S = state.slides; let at = S.length;
  if (tipo!=="cta" && S.length && S[S.length-1].tipo==="cta") at = S.length-1;
  if (tipo==="capa") at = 0;
  S.splice(at,0,base); sel=at; renderCards(); changed();
};

/* JSON */
const jsonBox = document.getElementById("json");
const jsonOut = () => JSON.stringify(state,null,2);
document.getElementById("jsonCopy").onclick = ()=> jsonBox.value = jsonOut();
document.getElementById("jsonLoad").onclick = ()=> loadJson(jsonBox.value);
document.getElementById("jsonFile").onchange = async e=>{ const f=e.target.files[0]; if(f) loadJson(await f.text()) };
function loadJson(txt){
  try{
    const d = typeof txt==="string" ? JSON.parse(txt) : txt;
    if(!Array.isArray(d.slides)) throw new Error("JSON sem 'slides'");
    state = {marca:{...EXEMPLO.marca,...(d.marca||{})}, slides:d.slides};
    sel=0; syncMarca(); renderCards(); save(); renderAll(); setStatus("Roteiro carregado.");
  }catch(err){ alert("JSON inválido: "+err.message) }
}
function syncMarca(){ document.querySelectorAll("[data-m]").forEach(el=>{ const v=state.marca[el.dataset.m]||""; el.value = typeof v==="string"&&v.startsWith("data:")?"(imagem enviada)":v }) }
window.loadCarrossel = async d => { loadJson(d); await renderAll(); return state.slides.length };

document.getElementById("reset").onclick = ()=>{ if(confirm("Substituir pelo exemplo?")){ state=structuredClone(EXEMPLO); sel=0; syncMarca(); renderCards(); save(); renderAll() } };
document.getElementById("exportJson").onclick = ()=> download(new Blob([jsonOut()],{type:"application/json"}), "carrossel.json");
document.getElementById("zoom").oninput = e=>{ zoom=+e.target.value; renderAll() };

/* ============================================================
   EXPORTAÇÃO PNG
   ============================================================ */
function setStatus(t){ document.getElementById("status").textContent = t }
function download(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000) }
document.getElementById("exportZip").onclick = async ()=>{
  const errs = checks().filter(c=>c[0]==="err");
  if (errs.length && !confirm("O carrossel não segue as regras:\n\n"+errs.map(e=>"• "+e[1]).join("\n")+"\n\nExportar mesmo assim?")) return;
  const zip = new JSZip();
  const nodes = [...stage.querySelectorAll(".slide")];
  for (let i=0;i<nodes.length;i++){
    setStatus(`Gerando ${i+1}/${nodes.length}…`);
    const url = await htmlToImage.toPng(nodes[i], {width:1080,height:1350,pixelRatio:1,cacheBust:true,style:{transform:"none"}});
    zip.file(String(i+1).padStart(2,"0")+".png", url.split(",")[1], {base64:true});
  }
  download(await zip.generateAsync({type:"blob"}), "carrossel-zanellato.zip");
  setStatus("Pronto ✓");
};

syncMarca(); renderCards(); renderAll();
</script>
