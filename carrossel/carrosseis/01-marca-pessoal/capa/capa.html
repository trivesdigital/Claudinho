<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300&display=swap">
<style>
html,body{margin:0;background:#000}
.c{position:relative;width:1080px;height:1350px;overflow:hidden}
.c>img{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;left:80px;right:80px;top:0;color:#fff;font-family:Poppins,sans-serif;text-align:center}
.kick{position:absolute;left:0;right:0;top:112px;font:400 19px/1 Poppins;letter-spacing:.46em;text-transform:uppercase;padding-left:.46em;opacity:.95}
.big{position:absolute;left:0;right:0;top:150px;font:200 136px/1 Poppins;letter-spacing:-.035em;white-space:nowrap}
.big i{font-style:italic;font-weight:300}
.foot{position:absolute;right:60px;top:300px;display:flex;align-items:center;justify-content:flex-end;gap:20px;font:400 19px/1 Poppins;letter-spacing:.46em;text-transform:uppercase}
.foot span{display:block;width:56px;height:1px;background:rgba(255,255,255,.85)}
.foot b{font-weight:400;margin-right:-.46em}
.sign{position:absolute;left:0;right:0;bottom:80px;text-align:center;color:#fff;font:300 17px/1 Poppins;letter-spacing:.5em;text-transform:uppercase;padding-left:.5em;opacity:.9}
</style></head><body>
<div class="c">
  <img src="foto.jpg">
  <div class="t">
    <div class="kick">Como eu construiria uma</div>
    <div class="big">Marca <i>Pessoal</i></div>
    <div class="foot"><span></span><b>do zero</b></div>
  </div>
  <img src="frente.png">
</div>
<script>
document.fonts.ready.then(()=>{const m=document.querySelector('.big');const r=document.createRange();r.selectNodeContents(m);
const w=r.getBoundingClientRect().width; m.style.fontSize=(136*800/w)+'px'; const f=document.querySelector('.foot');const R=r.getBoundingClientRect();f.style.right=(1000-R.right)+'px';document.body.dataset.ok=1});
</script>
</body></html>
